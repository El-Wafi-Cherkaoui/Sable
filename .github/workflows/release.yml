name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          title="$(grep -m1 "^## ${version} " CHANGELOG.md | sed 's/^## //')"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md

          if [ -z "$title" ] || [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for ${version}." >&2
            exit 1
          fi

          echo "RELEASE_TITLE=${title}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
